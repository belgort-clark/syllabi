<!doctype html><html><head><meta charset="utf-8"><style>
  :root{
    --paper:#F6F8F9; --surface:#FFFFFF; --ink:#152430; --ink-soft:#3B4C59;
    --muted:#5B6B77; --rule:#D8E1E7; --accent:#22617D; --accent-quiet:#E2EEF3;
    --warm:#8A5A0E; --warm-quiet:#F7EEDC;
    --f:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    --fm:"Atkinson Hyperlegible Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px}
  body{background:var(--paper);font-family:var(--f);color:var(--ink);
       display:flex;overflow:hidden}
  .bar{width:18px;height:100%;background:var(--accent);flex:none}
  .wrap{flex:1;padding:64px 72px 56px 64px;display:flex;flex-direction:column;justify-content:space-between}

  .eyebrow{font-family:var(--fm);font-size:21px;font-weight:600;letter-spacing:.16em;
           text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:14px}
  .eyebrow .dot{width:5px;height:5px;border-radius:50%;background:var(--rule)}

  h1{font-size:132px;line-height:.92;font-weight:700;letter-spacing:-.025em;margin-top:26px}
  .sub{font-size:40px;line-height:1.26;font-weight:400;color:var(--ink-soft);
       margin-top:24px;max-width:27ch}

  .facts{display:flex;align-items:center;gap:0;flex-wrap:wrap;
         font-size:23px;color:var(--muted);margin-top:34px}
  .facts span{white-space:nowrap}
  .facts i{display:inline-block;width:1px;height:19px;background:var(--rule);margin:0 18px;font-style:normal}

  .foot{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;
        border-top:1px solid var(--rule);padding-top:26px}
  .link{font-family:var(--fm);font-size:26px;font-weight:600;color:var(--ink)}
  .link .lead{color:var(--muted);font-weight:400;display:block;font-size:17px;
              letter-spacing:.13em;text-transform:uppercase;margin-bottom:9px}
  .chip{font-family:var(--fm);font-size:18px;font-weight:600;letter-spacing:.1em;
        text-transform:uppercase;color:var(--warm);background:var(--warm-quiet);
        border-radius:999px;padding:9px 18px;white-space:nowrap}
</style></head><body>
  <div class="bar"></div>
  <div class="wrap">
    <div>
      <div class="eyebrow">Clark College <span class="dot"></span> Fall 2026</div>
      <h1>CTEC&nbsp;121</h1>
      <div class="sub">Introduction to Programming and Problem Solving</div>
      <div class="facts">
        <span>Bruce Elgort</span><i></i>
        <span>Mondays &amp; Wednesdays, 10:00&ndash;12:20</span><i></i>
        <span>Scarpelli Hall 125</span>
      </div>
    </div>
    <div class="foot">
      <div class="link"><span class="lead">Course syllabus</span>bit.ly/ctec121fall2026</div>
      <div class="chip">Python &middot; 5 credits</div>
    </div>
  </div>
</body></html>
